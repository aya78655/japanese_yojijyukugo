<style>
  :root{
    --bg:#f7f5f0;
    --card:#ffffff;
    --ink:#2d2a26;
    --sub:#6b6560;
    --accent:#3a6b5c;
    --accent-soft:#e7efec;
    --correct:#3a7d3a;
    --correct-bg:#e6f4e6;
    --wrong:#b3452e;
    --wrong-bg:#fbe9e5;
    --border:#e3ddd2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:80px;
  }
  header{
    text-align:center;
    padding:36px 16px 20px;
  }
  header h1{
    margin:0 0 8px;
    font-size:1.6rem;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:0.95rem;
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:0 16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 20px 16px;
    margin-bottom:16px;
  }
  .q-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .q-num{
    font-size:0.8rem;
    color:var(--sub);
    background:var(--accent-soft);
    border-radius:999px;
    padding:2px 10px;
  }
  .q-term{
    font-size:1.25rem;
    font-weight:700;
  }
  .q-emoji{
    font-size:1.3rem;
  }
  .q-reading{
    font-size:0.85rem;
    color:var(--sub);
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  button.choice{
    text-align:left;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:#fff;
    font-size:0.98rem;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button.choice:hover:not(:disabled){
    border-color:var(--accent);
  }
  button.choice:disabled{
    cursor:default;
  }
  button.choice .label{
    font-weight:700;
    margin-right:8px;
    color:var(--accent);
  }
  button.choice.correct{
    background:var(--correct-bg);
    border-color:var(--correct);
    color:var(--correct);
  }
  button.choice.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .feedback{
    margin-top:10px;
    font-size:0.9rem;
    font-weight:600;
  }
  .feedback.ok{ color:var(--correct); }
  .feedback.no{ color:var(--wrong); }

  .scorebar{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(247,245,240,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    justify-content:center;
    gap:24px;
    font-size:0.9rem;
  }
  .scorebar strong{
    color:var(--accent);
  }
  .reset-wrap{
    max-width:720px;
    margin:20px auto 0;
    padding:0 16px;
    text-align:center;
  }
  #reset-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:999px;
    font-size:0.95rem;
    cursor:pointer;
  }
  #reset-btn:hover{
    opacity:0.9;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.8rem;
    padding:30px 16px 10px;
  }
</style>

const LABELS = ["A","B","C","D"];
const quizEl = document.getElementById("quiz");
const answeredEl = document.getElementById("answered");
const scoreEl = document.getElementById("score");
let answeredCount = 0;
let score = 0;

function render(){
  quizEl.innerHTML = "";
  answeredCount = 0;
  score = 0;
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML = `
      <span class="q-num">第${qi+1}問</span>
      <span class="q-term">${q.term}</span>
      <span class="q-emoji">${q.emoji}</span>
      <span class="q-reading">（${q.reading}）</span>
    `;
    card.appendChild(head);

    const choicesWrap = document.createElement("div");
    choicesWrap.className = "choices";

    const feedback = document.createElement("div");
    feedback.className = "feedback";

    q.choices.forEach((text, ci) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = `<span class="label">${LABELS[ci]}</span>${text}`;
      btn.addEventListener("click", () => {
        if (btn.dataset.locked) return;
        const buttons = choicesWrap.querySelectorAll("button.choice");
        buttons.forEach(b => b.dataset.locked = "1");

        if (ci === q.correct) {
          btn.classList.add("correct");
          feedback.textContent = "○ 正解！";
          feedback.className = "feedback ok";
          score++;
        } else {
          btn.classList.add("wrong");
          buttons[q.correct].classList.add("correct");
          feedback.textContent = "× 不正解";
          feedback.className = "feedback no";
        }
        answeredCount++;
        answeredEl.textContent = answeredCount;
        scoreEl.textContent = score;
      });
      choicesWrap.appendChild(btn);
    });

    card.appendChild(choicesWrap);
    card.appendChild(feedback);
    quizEl.appendChild(card);
  });
  answeredEl.textContent = answeredCount;
  scoreEl.textContent = score;
}

document.getElementById("reset-btn").addEventListener("click", render);

render();
